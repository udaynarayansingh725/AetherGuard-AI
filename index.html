    function createLucideIcon(iconData, name) {

        if (!iconData || !Array.isArray(iconData)) {
          return (
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width={size}
              height={size}
              viewBox="0 0 24 24"
              fill="none"
              stroke={color}
              strokeWidth={strokeWidth}
              strokeLinecap="round"
              strokeLinejoin="round"
              className={className}
              {...props}

            </svg>
          );
        }
        return (
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width={size}
            height={size}
            viewBox="0 0 24 24"
            fill="none"
            stroke={color}
            strokeWidth={strokeWidth}

            className={className}

        );
      };

// Universal Report Download Helpers
function triggerBrowserDownload(filename, content, mimeType = 'text/plain;charset=utf-8') {
  try {
    const blob = new Blob([content], { type: mimeType });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  } catch (err) {
    console.error("Browser download failed:", err);
  }
}

      if (res.ok) return res.text();
      throw new Error('Backend export fallback');

function downloadAllThreatsReport(threats) {
  if (!threats || !threats.length) return;
  const exportUrl = `${FastAPI_Service.baseUrl}/threats/export`;

  fetch(exportUrl)
    .then(res => {
      if (res.ok) return res.text();
      throw new Error('Backend export fallback');
    })
    .then(csvText => {
      const nowStr = new Date().toISOString().slice(0, 10);
      triggerBrowserDownload(`ThreatLen_Threats_Report_${nowStr}.csv`, csvText, 'text/csv;charset=utf-8');
    })
    .catch(() => {
      const headers = ["id", "sourceIp", "destIp", "port", "protocol", "requests", "failedLogins", "anomalyScore", "threatType", "risk", "status", "timestamp", "accountsTargeted", "country", "targetService"];
      const rows = threats.map(t => [
        t.id,
        t.sourceIp,
        t.destIp,
        t.port,
        `"${t.protocol}"`,
        t.requests,
        t.failedLogins,
        t.anomalyScore,
        `"${t.threatType}"`,
        `"${t.risk}"`,
        `"${t.status || 'Active'}"`,
        `"${t.timestamp}"`,
        t.accountsTargeted || 0,
        `"${t.country || ''}"`,
        `"${t.targetService || ''}"`
      ].join(","));
      
      const csv = [headers.join(","), ...rows].join("\n");
      const nowStr = new Date().toISOString().slice(0, 10);
      triggerBrowserDownload(`ThreatLen_Threats_Report_${nowStr}.csv`, csv, 'text/csv;charset=utf-8');
    });
}

    };
    updateHealth();
    const interval = setInterval(updateHealth, 4000);
    return () => { isMounted = false; clearInterval(interval); };
  }, []);


  // Fetch initial live threats, incidents, and users from backend SQLite DB
  useEffect(() => {
    let isMounted = true;
    const loadData = async () => {
      const [tData, iData, uData] = await Promise.all([
        FastAPI_Service.fetchThreats(),
        FastAPI_Service.fetchIncidents(),
        FastAPI_Service.fetchUsers()
      ]);
      if (isMounted) {
        if (tData && tData.length) {
          setThreatsList(tData);
          setSelectedThreat(tData[0]);
        }
        if (iData && iData.length) {
          setIncidentsList(iData);
          setSelectedIncident(iData[0]);
        }
        if (uData && uData.length) {
          setUsersList(uData);
        }
      }
    };
    loadData();
  }, []);

  // Global Key Shortcut
  useEffect(() => {
    const handleKeyDown = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
        e.preventDefault();
        setAiAssistantOpen(prev => !prev);
      }
    };
    window.addEventListener('keydown', handleKeyDown);
    return () => window.removeEventListener('keydown', handleKeyDown);
  }, []);

  const handleMitigateThreat = async (threatId) => {
    await FastAPI_Service.mitigateThreat(threatId);
    setThreatsList(prev => prev.map(t => t.id === threatId ? { ...t, status: 'Mitigated' } : t));
    if (selectedThreat && selectedThreat.id === threatId) {
      setSelectedThreat(prev => ({ ...prev, status: 'Mitigated' }));
    }
  };

  const handleSendAiMessage = async (textToSend) => {
    const text = textToSend || aiInput;
    if (!text.trim()) return;
    
    const newMsgs = [...aiMessages, { sender: 'user', text }];
    setAiMessages(newMsgs);
    setAiInput('');
    setIsProcessingAI(true);

    const reply = await FastAPI_Service.queryAIAssistant(text);
    setAiMessages([...newMsgs, { sender: 'ai', text: reply }]);
    setIsProcessingAI(false);
  };

  if (!isLoggedIn) {
    if (activePage === 'register') {
      return <RegisterPage onNavigateLogin={() => setActivePage('login')} />;
    }
    return (
      <LoginPage 
        onLogin={(user) => { 
          setIsLoggedIn(true); 
          if (user && user.role) setUserRole(user.role); 
          setActivePage('dashboard'); 
        }} 
        onNavigateRegister={() => setActivePage('register')} 
      />
    );
  }

  return (
    <div className="flex h-screen bg-[#0B1120] text-slate-100 font-sans overflow-hidden select-none">
      {/* Sidebar Navigation */}
      <Sidebar activePage={activePage} setActivePage={setActivePage} onLogout={() => setIsLoggedIn(false)} />

      {/* Main Content Area */}
      <div className="flex-1 flex flex-col min-w-0 overflow-hidden">
        {/* Top Header */}
        <Topbar 
          onOpenAi={() => setAiAssistantOpen(true)}
          notificationsOpen={notificationsOpen}
          setNotificationsOpen={setNotificationsOpen}
          activePage={activePage}
          userRole={userRole}
          backendStatus={backendStatus}
          dbTelemetry={dbTelemetry}
        />

        {/* Dynamic Page Router */}
        <main className="flex-1 overflow-y-auto p-6 bg-[#0B1120] relative">
          {activePage === 'login' && <LoginPage onLogin={(user) => { setIsLoggedIn(true); if (user && user.role) setUserRole(user.role); }} onNavigateRegister={() => setActivePage('register')} />}
          {activePage === 'register' && <RegisterPage onNavigateLogin={() => setActivePage('login')} />}
          {activePage === 'dashboard' && <DashboardView threats={threatsList} onSelectThreat={(t) => { setSelectedThreat(t); setActivePage('investigation'); }} onNavigate={setActivePage} />}
          {activePage === 'log-upload' && <LogUploadView onRunAnalysis={(file) => { setUploadedFile(file); setActivePage('ai-analysis'); }} />}
          {activePage === 'ai-analysis' && <AIAnalysisView file={uploadedFile} onComplete={(result) => { 
            if (result && result.threats && result.threats.length) {
              setThreatsList(result.threats);
            }
            setLastAnalysis(result);
            setActivePage('threat-detection'); 
          }} />}
          {activePage === 'threat-detection' && <ThreatDetectionView threats={threatsList} onInvestigate={(t) => { setSelectedThreat(t); setActivePage('investigation'); }} />}
          {activePage === 'investigation' && <ThreatInvestigationView threat={selectedThreat} onBack={() => setActivePage('threat-detection')} onMitigate={handleMitigateThreat} />}
          {activePage === 'threat-history' && <ThreatHistoryView threats={threatsList} />}
          {activePage === 'incidents' && <IncidentDetailsView incidents={incidentsList} incident={selectedIncident} onSelectIncident={setSelectedIncident} />}
          {activePage === 'reports' && <ReportsView onNavigateGenerate={() => setActivePage('generate-report')} />}
          {activePage === 'generate-report' && <GenerateReportView onBack={() => setActivePage('reports')} />}
          {activePage === 'users' && <UserManagementView users={usersList} />}
          {activePage === 'settings' && <SettingsView onUpdateEndpoint={(url) => FastAPI_Service.setBaseUrl(url)} userRole={userRole} setUserRole={setUserRole} backendStatus={backendStatus} dbTelemetry={dbTelemetry} />}
        </main>

      </div>


      {/* AI Assistant Drawer */}
      {aiAssistantOpen && (
        <AIAssistantDrawer 
          onClose={() => setAiAssistantOpen(false)}
          messages={aiMessages}
          input={aiInput}
          setInput={setAiInput}
          onSend={handleSendAiMessage}
          isProcessing={isProcessingAI}
        />
      )}
    </div>
  );
}

function DashboardView({ threats = MOCK_THREATS, onSelectThreat, onNavigate }) {
  const stats = useMemo(() => {
    const list = threats || [];
    const totalRequests = list.reduce((acc, t) => acc + (Number(t.requests) || 0), 0);
    const criticalCount = list.filter(t => t.risk === 'Critical').length;
    const highCount = list.filter(t => t.risk === 'High').length;
    const mediumCount = list.filter(t => t.risk === 'Medium').length;
    const lowCount = list.filter(t => t.risk === 'Low').length;
    const totalFlagged = list.length || 1;

    const bruteCount = list.filter(t => (t.threatType || '').toLowerCase().includes('brute')).length;
    const scanCount = list.filter(t => (t.threatType || '').toLowerCase().includes('scan') || (t.threatType || '').toLowerCase().includes('port')).length;
    const loginCount = list.filter(t => (t.threatType || '').toLowerCase().includes('login') || (t.threatType || '').toLowerCase().includes('abnormal')).length;
    const dosCount = list.filter(t => (t.threatType || '').toLowerCase().includes('dos') || (t.threatType || '').toLowerCase().includes('pattern')).length;

    return {
      totalLogs: (totalRequests > 0 ? totalRequests : 12540).toLocaleString(),
      normalTraffic: (totalRequests > 0 ? Math.round(totalRequests * 0.78) : 9821).toLocaleString(),
      suspicious: (mediumCount + highCount).toLocaleString(),
      critical: criticalCount.toLocaleString(),
      criticalCount,
      highCount,
      mediumCount,
      lowCount,
      brute: { count: bruteCount, pct: ((bruteCount / totalFlagged) * 100).toFixed(1) + '%' },
      scan: { count: scanCount, pct: ((scanCount / totalFlagged) * 100).toFixed(1) + '%' },
      login: { count: loginCount, pct: ((loginCount / totalFlagged) * 100).toFixed(1) + '%' },
      dos: { count: dosCount, pct: ((dosCount / totalFlagged) * 100).toFixed(1) + '%' },
      critPct: ((criticalCount / totalFlagged) * 100).toFixed(1),
      highPct: ((highCount / totalFlagged) * 100).toFixed(1),
      medPct: ((mediumCount / totalFlagged) * 100).toFixed(1)
    };
  }, [threats]);

            <Download className="w-3.5 h-3.5 text-cyan-400" /> Export Threats

        </div>
      </div>

      {/* Top Metric KPI Cards */}
      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
        <KpiCard title="Total Logs Processed" value={stats.totalLogs} change="+12.4%" subtext="Last 24 hours" icon={Database} color="blue" />
        <KpiCard title="Normal Traffic" value={stats.normalTraffic} change="78.3%" subtext="Baseline operational" icon={CheckCircle2} color="emerald" />

function LogUploadView({ onRunAnalysis }) {
  const [selectedFile, setSelectedFile] = useState(null);
  const [fileObject, setFileObject] = useState(null);
  const [dragActive, setDragActive] = useState(false);
  const [uploadProgress, setUploadProgress] = useState(0);
  const fileInputRef = React.useRef(null);

  const handleDrop = (e) => {
    e.preventDefault();
    setDragActive(false);
    if (e.dataTransfer.files && e.dataTransfer.files[0]) {
      handleRealFile(e.dataTransfer.files[0]);
    } else {
      simulateFileUpload("server_auth_syslog_2026.csv", "4.2 MB", 12540, null);
    }
  };

  const handleRealFile = (file) => {
    setFileObject(file);
    setUploadProgress(20);
    const sizeStr = (file.size / 1024).toFixed(1) + " KB";
    setSelectedFile({ name: file.name, size: sizeStr, records: Math.floor(file.size / 60) || 20, status: "Uploading..." });

    let p = 20;
    const interval = setInterval(() => {
      p += 35;
      if (p >= 100) {
        clearInterval(interval);
        setUploadProgress(100);
        setSelectedFile(prev => ({ ...prev, status: "Ready for Isolation Forest" }));
      } else {
        setUploadProgress(p);
      }
    }, 150);
  };

  const simulateFileUpload = (name, size, records, rawFile) => {
    setFileObject(rawFile);
    setUploadProgress(10);
    setSelectedFile({ name, size, records, status: "Uploading..." });
    
    let interval = setInterval(() => {
      setUploadProgress((prev) => {
        if (prev >= 100) {
          clearInterval(interval);
          setSelectedFile({ name, size, records, status: "Ready for AI Engine" });
          return 100;
        }
        return prev + 30;
      });
    }, 150);
  };

  return (
    <div className="max-w-4xl mx-auto space-y-6">
      <div>
        <h2 className="text-xl font-bold text-white flex items-center gap-2">
          <Upload className="w-5 h-5 text-blue-400" /> Server Log Upload & Ingestion
        </h2>
        <p className="text-xs text-slate-400 mt-1">
          Ingest raw system, syslog, or cloud access logs to trigger Scikit-Learn Isolation Forest threat evaluation.
        </p>
      </div>

      {/* Drag & Drop Zone */}
      <div 
        onDragOver={(e) => { e.preventDefault(); setDragActive(true); }}
        onDragLeave={() => setDragActive(false)}
        onDrop={handleDrop}
        className={`border-2 border-dashed rounded-2xl p-10 text-center transition flex flex-col items-center justify-center min-h-[260px] ${
          dragActive 
            ? 'border-blue-500 bg-blue-950/20' 
            : 'border-slate-700 bg-[#1E293B]/60 hover:border-slate-600'
        }`}
      >
        <div className="w-14 h-14 bg-slate-900 border border-slate-800 rounded-full flex items-center justify-center mb-4 text-cyan-400">
          <HardDrive className="w-7 h-7" />
        </div>
        <h3 className="text-base font-semibold text-slate-200">Drag and drop log files here</h3>
        <p className="text-xs text-slate-400 mt-1 mb-4">Supported Formats: <span className="font-mono text-cyan-300">.CSV, .JSON, .TXT (Syslog format)</span></p>
        
        <div className="flex gap-3">
          <input 
            type="file" 
            ref={fileInputRef} 
            onChange={(e) => e.target.files && e.target.files[0] && handleRealFile(e.target.files[0])} 
            accept=".csv,.json,.txt" 
            className="hidden" 
          />
          <button 
            onClick={() => fileInputRef.current && fileInputRef.current.click()}
            className="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-xs font-medium transition flex items-center gap-1.5 shadow-md shadow-blue-500/20"
          >
            <Upload className="w-3.5 h-3.5" /> Browse System Log File
          </button>
          <button 
            onClick={() => simulateFileUpload("sample_network_logs.csv", "1.2 KB", 20, null)}
            className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-lg text-xs font-medium transition"
          >
            Load Sample Security CSV
          </button>
        </div>
      </div>

      {/* Uploaded File Details & Status */}
      {selectedFile && (
        <div className="bg-[#1E293B] border border-slate-800 rounded-xl p-5 space-y-4">
          <div className="flex items-center justify-between">
            <div className="flex items-center gap-3">
              <FileText className="w-8 h-8 text-cyan-400" />
              <div>
                <h4 className="text-sm font-bold text-slate-200">{selectedFile.name}</h4>
                <p className="text-xs text-slate-400 font-mono">
                  {selectedFile.size} • {selectedFile.records.toLocaleString()} Records • UTF-8 Encoded
                </p>
              </div>
            </div>
            <span className={`text-xs px-2.5 py-1 rounded-full font-mono ${
              uploadProgress === 100 
                ? 'bg-emerald-950 text-emerald-400 border border-emerald-800'

          <div className="w-full bg-slate-900 h-2 rounded-full overflow-hidden">
            <div className="bg-gradient-to-r from-blue-500 to-cyan-400 h-full transition-all duration-300" style={{ width: `${uploadProgress}%` }}></div>
          </div>

          {/* Action Trigger */}

            <div className="flex justify-end pt-2">
              <button 
                onClick={() => onRunAnalysis(fileObject)}

function AIAnalysisView({ file, onComplete }) {
  const [currentStep, setCurrentStep] = useState(0);
  const [analysisResult, setAnalysisResult] = useState(null);

  const steps = [
    { title: "LOG INGESTION", desc: "Parsing CSV/JSON structured payload" },
    { title: "DATA CLEANING", desc: "Filtering nulls & normalizing IPs" },
    { title: "FEATURE EXTRACTION", desc: "Computing delta time & login rates" },
    { title: "FEATURE SCALING", desc: "StandardScaler transformation" },
    { title: "ISOLATION FOREST", desc: "Fitting IsolationForest tree models" },
    { title: "ANOMALY DETECTION", desc: "Evaluating decision function score" },
    { title: "THREAT CLASSIFICATION", desc: "Categorizing attack patterns" },
    { title: "RISK ANALYSIS", desc: "Assigning critical threshold metrics" }
  ];

  // Trigger live ML execution in background while visual steps animate
  useEffect(() => {
    let isMounted = true;
    const runML = async () => {
      const res = await FastAPI_Service.runIsolationForestAnalysis(file);
      if (isMounted) setAnalysisResult(res);
    };
    runML();
    return () => { isMounted = false; };
  }, [file]);

  useEffect(() => {
    if (currentStep < steps.length) {
      const timer = setTimeout(() => {
        setCurrentStep(prev => prev + 1);
      }, 450);
      return () => clearTimeout(timer);
    }
  }, [currentStep]);

  return (
    <div className="max-w-4xl mx-auto space-y-8 py-4">
      <div className="text-center space-y-2">
        <div className="inline-flex items-center gap-2 px-3 py-1 bg-cyan-950/80 border border-cyan-800 rounded-full text-cyan-400 text-xs font-mono">
          <Cpu className="w-3.5 h-3.5 animate-spin-slow" /> ML PIPELINE EXECUTING
        </div>
        <h2 className="text-2xl font-bold text-white">AI Cyber Threat Pipeline</h2>
        <p className="text-xs text-slate-400 max-w-lg mx-auto">
          Executing Scikit-Learn Isolation Forest engine against ingested telemetry to identify outlier network vectors.
        </p>
      </div>

      {/* Visual Step-by-Step Flow */}
      <div className="bg-[#1E293B] border border-slate-800 rounded-2xl p-6 shadow-2xl relative overflow-hidden">
        <div className="space-y-4">
          {steps.map((s, idx) => {
            const isDone = idx < currentStep;
            const isCurrent = idx === currentStep;

            return (
              <div 
                key={idx}
                className={`p-3.5 rounded-xl border flex items-center justify-between transition-all duration-300 ${
                  isDone 
                    ? 'bg-slate-900/90 border-emerald-500/40 text-slate-200' 
                    : isCurrent 
                    ? 'bg-blue-950/40 border-cyan-500 shadow-md shadow-cyan-500/10 text-white' 
                    : 'bg-slate-900/30 border-slate-800/60 text-slate-600'
                }`}
              >
                <div className="flex items-center gap-4">
                  <div className={`w-7 h-7 rounded-full flex items-center justify-center font-mono text-xs font-bold ${
                    isDone 
                      ? 'bg-emerald-500 text-slate-950' 
                      : isCurrent 
                      ? 'bg-cyan-400 text-slate-950 animate-pulse' 
                      : 'bg-slate-800 text-slate-500'
                  }`}>
                    {isDone ? <Check className="w-4 h-4 stroke-[3]" /> : idx + 1}
                  </div>
                  <div>
                    <h4 className="text-xs font-bold font-mono tracking-wide">{s.title}</h4>
                    <p className="text-[11px] text-slate-400">{s.desc}</p>
                  </div>
                </div>

                <div className="font-mono text-xs">
                  {isDone && <span className="text-emerald-400 text-[11px]">COMPLETED</span>}
                  {isCurrent && <span className="text-cyan-400 text-[11px] animate-pulse">PROCESSING...</span>}
                  {!isDone && !isCurrent && <span className="text-slate-600 text-[11px]">QUEUED</span>}
                </div>
              </div>
            );
          })}
        </div>

        {/* Completion Call to Action */}
        {currentStep >= steps.length && (
          <div className="mt-6 pt-4 border-t border-slate-800 text-center animate-fade-in">
            <div className="p-3 bg-emerald-950/30 border border-emerald-800/50 rounded-xl mb-4 text-emerald-400 text-xs font-mono">
              ✓ Analysis Finished: {analysisResult ? analysisResult.processedRows.toLocaleString() : "12,540"} Logs Scanned • {analysisResult ? analysisResult.anomaliesDetected.toLocaleString() : "1,964"} Anomalies Flagged • Execution: {analysisResult ? analysisResult.executionTimeMs : "412"}ms • Model: {analysisResult ? analysisResult.modelUsed : "IsolationForest"}
            </div>
            <button 
              onClick={() => onComplete(analysisResult)}
              className="px-6 py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-lg text-xs shadow-lg transition inline-flex items-center gap-2"
            >
              View Threat Detection Grid <ArrowRight className="w-4 h-4" />
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

function ThreatInvestigationView({ threat, onBack }) {
  if (!threat) return null;

  const dynamicAiExplanation = useMemo(() => {
    const type = (threat.threatType || '').toLowerCase();
    if (type.includes('brute')) {
      return `AI detected an abnormal authentication surge. The source IP ${threat.sourceIp} directed ${threat.failedLogins} failed authentication requests against ${threat.destIp}:${threat.port} (${threat.protocol}) across ${threat.accountsTargeted || 1} user accounts within 2 minutes, exceeding baseline thresholds by ${((threat.failedLogins || 1) / 2.1).toFixed(1)}x.`;
    } else if (type.includes('dos') || type.includes('flood') || type.includes('pattern')) {
      return `Volumetric traffic anomaly detected. Source ${threat.sourceIp} initiated ${Number(threat.requests || 0).toLocaleString()} connections to ${threat.destIp}:${threat.port} (${threat.protocol}), causing an abnormal throughput spike exceeding normal baseline thresholds.`;
    } else if (type.includes('port') || type.includes('scan')) {
      return `Horizontal network reconnaissance sweep detected. Source ${threat.sourceIp} probed destination subnet ${threat.destIp} across multiple ports with ${Number(threat.requests || 0).toLocaleString()} TCP SYN packets and zero authentication handshakes.`;
    } else if (type.includes('abnormal') || type.includes('login')) {
      return `Credential anomaly identified. Source ${threat.sourceIp} generated ${threat.failedLogins} failed logins to remote management service (${threat.protocol}/${threat.port}) on ${threat.destIp}.`;
    } else {
      return `Isolation Forest algorithm detected an anomaly score of ${threat.anomalyScore} (Risk: ${threat.risk}) for source ${threat.sourceIp} targeting ${threat.destIp} on port ${threat.port} with ${threat.requests} requests.`;
    }
  }, [threat]);

  const baselineMetric1 = useMemo(() => {
    const type = (threat.threatType || '').toLowerCase();
    if (type.includes('dos') || type.includes('flood')) {
      return {
        label: 'Request Throughput / Min',
        observed: `${Math.round((threat.requests || 100) / 2)} req/min`,
        baseline: '45 req/min',
        observedPct: 95
      };
    } else if (type.includes('port') || type.includes('scan')) {
      return {
        label: 'Probed Destination Ports / Min',
        observed: `${threat.requests} ports`,
        baseline: '3 ports',
        observedPct: 92
      };
    } else {
      return {
        label: 'Failed Login Frequency / Min',
        observed: `${threat.failedLogins} attempts`,
        baseline: '2.1 attempts',
        observedPct: 94
      };
    }
  }, [threat]);

  const baselineMetric2 = useMemo(() => {
    const type = (threat.threatType || '').toLowerCase();
    if (type.includes('dos') || type.includes('flood')) {
      return {
        label: 'Concurrent Inbound Sockets',
        observed: `${Math.min(threat.requests || 100, 1024)} sockets`,
        baseline: '12 sockets',
        observedPct: 90
      };
    } else {
      return {
        label: 'Target User Accounts Spread',
        observed: `${threat.accountsTargeted || 1} accounts`,
        baseline: '1 account',
        observedPct: Math.min(95, Math.max(20, (threat.accountsTargeted || 1) * 15))
      };
    }
  }, [threat]);

  return (
    <div className="space-y-6">

function GenerateReportView({ onBack }) {
  const [isGenerating, setIsGenerating] = useState(false);

  const handleGenerate = async () => {
    setIsGenerating(true);
    try {
      const res = await fetch(`${FastAPI_Service.baseUrl}/reports/generate`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ timeHorizon })
      });
      if (res.ok) {
        const data = await res.json();
        downloadExecutiveReport(data);

            onClick={handleAuth}
            disabled={loading}
            className="w-full py-3 bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-500 hover:to-cyan-400 text-white font-bold rounded-lg shadow-lg transition flex items-center justify-center gap-2 cursor-pointer"
          >
            {loading ? <RefreshCw className="w-4 h-4 animate-spin" /> : <Lock className="w-4 h-4" />}
            {loading ? "Authenticating..." : "Authenticate Access (Database Verified)"}
          </button>
        </div>

        <div className="text-center pt-2">
          <button onClick={onNavigateRegister} className="text-xs text-cyan-400 hover:underline cursor-pointer">
            Register new Analyst Credentials
          </button>
        </div>
      </div>
    </div>
  );
}

function RegisterPage({ onNavigateLogin }) {
  const [name, setName] = useState('');
  const [email, setEmail] = useState('');
  const [role, setRole] = useState('Security Analyst');
  const [loading, setLoading] = useState(false);
  const [msg, setMsg] = useState('');

  const handleRegister = async () => {
    if (!email) return;
    setLoading(true);
    const user = await FastAPI_Service.register(name || email.split('@')[0], email, role);
    setLoading(false);
    if (user) {
      setMsg(`Analyst ${user.name} registered successfully! Redirecting to login...`);
      setTimeout(() => {
        onNavigateLogin();
      }, 1500);
    } else {
      onNavigateLogin();
    }
  };

  return (
    <div className="min-h-screen bg-[#0B1120] flex items-center justify-center p-4">
      <div className="w-full max-w-md bg-[#1E293B] border border-slate-800 rounded-2xl p-8 shadow-2xl space-y-6">
        <h2 className="text-xl font-bold text-white text-center">Analyst Onboarding (SQLite DB)</h2>
        <p className="text-xs text-slate-400 text-center">Register credential profile in enterprise database.</p>
        
        {msg && (
          <div className="p-3 bg-emerald-950/40 border border-emerald-800 rounded-lg text-emerald-400 text-xs text-center">
            {msg}
          </div>
        )}

        <div className="space-y-3 text-xs">
          <div>
            <label className="text-slate-300 block mb-1">Full Name</label>
            <input 
              type="text" 
              placeholder="e.g. Alex Mercer" 
              value={name}
              onChange={(e) => setName(e.target.value)}
              className="w-full bg-slate-900 border border-slate-800 rounded p-2.5 text-slate-200" 
            />
          </div>
          <div>
            <label className="text-slate-300 block mb-1">Corporate Email</label>
            <input 
              type="email" 
              placeholder="analyst@ibm.security" 
              value={email}
              onChange={(e) => setEmail(e.target.value)}
              className="w-full bg-slate-900 border border-slate-800 rounded p-2.5 text-slate-200 font-mono" 
            />
          </div>
          <div>
            <label className="text-slate-300 block mb-1">SOC Role</label>
            <select 
              value={role}
              onChange={(e) => setRole(e.target.value)}
              className="w-full bg-slate-900 border border-slate-800 rounded p-2.5 text-slate-200"
            >
              <option>Security Analyst</option>
              <option>Lead SOC Analyst</option>
              <option>Incident Responder</option>
              <option>Threat Hunter</option>
            </select>
          </div>
          <button 
            onClick={handleRegister} 
            disabled={loading}
            className="w-full py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-lg flex items-center justify-center gap-2 cursor-pointer transition"
          >
            {loading ? <RefreshCw className="w-4 h-4 animate-spin" /> : <UserPlus className="w-4 h-4" />}
            {loading ? "Registering..." : "Complete Registration & Save to DB"}
          </button>
          <div className="text-center pt-2">
            <button onClick={onNavigateLogin} className="text-xs text-slate-400 hover:text-slate-200 underline">
              Already have credentials? Log In
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}


function KpiCard({ title, value, change, subtext, icon: Icon, color }) {
  const colorMap = {
    blue: 'border-blue-500/30 text-blue-400 bg-blue-950/20',
    emerald: 'border-emerald-500/30 text-emerald-400 bg-emerald-950/20',
    amber: 'border-amber-500/30 text-amber-400 bg-amber-950/20',
    rose: 'border-rose-500/30 text-rose-400 bg-rose-950/20',
  };

  return (
    <div className={`p-4 rounded-xl border bg-[#1E293B] shadow-lg flex justify-between items-start ${colorMap[color]}`}>
      <div>
        <p className="text-[11px] text-slate-400 font-medium">{title}</p>
        <h3 className="text-2xl font-extrabold text-white mt-1 font-mono">{value}</h3>
        <p className="text-[10px] text-slate-400 mt-1">
          <span className="font-semibold text-cyan-400">{change}</span> • {subtext}
        </p>
      </div>
      <div className="p-2 rounded-lg bg-slate-900/80 border border-slate-800">
        <Icon className="w-5 h-5" />
      </div>
    </div>
  );
}

function ThreatStatMini({ title, count, percent, color, border }) {
  return (
    <div className={`p-3 rounded-lg bg-[#1E293B] border ${border} shadow-sm`}>
      <p className="text-[10px] uppercase font-mono text-slate-400">{title}</p>
      <div className="flex items-baseline justify-between mt-1">
        <span className={`text-base font-bold font-mono ${color}`}>{count}</span>
        <span className="text-[10px] text-slate-500 font-mono">{percent}</span>
      </div>
    </div>
  );
}

function RiskBadge({ level }) {
  const config = {
    Critical: 'bg-red-950 text-red-400 border-red-800',
    High: 'bg-orange-950 text-orange-400 border-orange-800',
    Medium: 'bg-amber-950 text-amber-400 border-amber-800',
    Low: 'bg-emerald-950 text-emerald-400 border-emerald-800',
  };

  return (
    <span className={`px-2 py-0.5 rounded text-[10px] font-mono font-bold border ${config[level] || config.Low}`}>
      {level}
    </span>
  );
}
