    // Helper to convert Lucide icon definitions to React components
    function createLucideIcon(iconData, name) {
      return function LucideIcon({ size = 20, className = '', color = 'currentColor', strokeWidth = 2, ...props }) {
        if (!iconData || !Array.isArray(iconData)) {
          return (
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width={size}
              height={size}
              viewBox="0 0 24 24"
              fill="none"
              stroke={color}
              strokeWidth={strokeWidth}
              strokeLinecap="round"
              strokeLinejoin="round"
              className={className}
              {...props}
            >
              <circle cx="12" cy="12" r="10" />
            </svg>
          );
        }
        return (
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width={size}
            height={size}
            viewBox="0 0 24 24"
            fill="none"
            stroke={color}
            strokeWidth={strokeWidth}
            strokeLinecap="round"
            strokeLinejoin="round"
            className={className}
            {...props}
          >
            {iconData.map(([tag, attrs], idx) => React.createElement(tag, { key: idx, ...attrs }))}
          </svg>
        );
      };
    }

    // Dynamic Icon resolver proxy
    const LucideIcons = new Proxy({}, {
      get(target, prop) {
        if (typeof prop !== 'string') return target[prop];
        if (prop in target) return target[prop];
        const data = (window.lucide && window.lucide[prop]) || (window.lucide && window.lucide.icons && window.lucide.icons[prop]);
        const comp = createLucideIcon(data, prop);
        target[prop] = comp;
        return comp;
      }

// Live FastAPI + Isolation Forest Backend Service
const FastAPI_Service = {
  baseUrl: 'http://127.0.0.1:8000/api/v1',

  setBaseUrl(url) {
    this.baseUrl = url.replace(/\/+$/, '');
  },

  async checkStatus() {
    try {
      const controller = new AbortController();
      const id = setTimeout(() => controller.abort(), 2500);
      const res = await fetch(`${this.baseUrl}/status`, { signal: controller.signal });
      clearTimeout(id);
      if (res.ok) {
        return await res.json();
      }
    } catch (e) {
      // Backend offline or unreachable
    }
    return {
      status: "offline",
      fastapi: "Disconnected",
      isolation_forest: "Offline",
      version: "v3.4-e (local)",
      active_threats: 7,
      active_incidents: 3
    };
  },

  async fetchThreats() {
    try {
      const controller = new AbortController();
      const id = setTimeout(() => controller.abort(), 2500);
      const res = await fetch(`${this.baseUrl}/threats`, { signal: controller.signal });
      clearTimeout(id);
      if (res.ok) {
        return await res.json();
      }
    } catch (e) {}
    return MOCK_THREATS;
  },

  async fetchIncidents() {
    try {
      const controller = new AbortController();
      const id = setTimeout(() => controller.abort(), 2500);
      const res = await fetch(`${this.baseUrl}/incidents`, { signal: controller.signal });
      clearTimeout(id);
      if (res.ok) {
        return await res.json();
      }
    } catch (e) {}
    return MOCK_INCIDENTS;
  },

  async runIsolationForestAnalysis(fileBlob) {
    try {
      let body = undefined;
      if (fileBlob instanceof File || fileBlob instanceof Blob) {
        const formData = new FormData();
        formData.append('file', fileBlob, fileBlob.name || 'logs.csv');
        body = formData;
      }
      
      const res = await fetch(`${this.baseUrl}/analyze-logs`, {
        method: 'POST',
        body: body
      });
      if (res.ok) {
        return await res.json();
      }
    } catch (e) {
      console.warn("FastAPI backend call failed, falling back to local simulation:", e);
    }

    // Graceful fallback if backend is offline
    return new Promise((resolve) => {
      setTimeout(() => {
        resolve({
          status: "success",
          modelUsed: "IsolationForest (contamination=0.05, n_estimators=100)",
          processedRows: fileBlob && fileBlob.size ? Math.floor(fileBlob.size / 60) : 12540,
          anomaliesDetected: 1964,
          criticalRisks: 755,
          executionTimeMs: 412,
          featureImportance: {
            "failed_logins": 0.42,
            "request_count": 0.28,
            "port_variance": 0.18,
            "time_delta": 0.12
          },
          threats: MOCK_THREATS
        });
      }, 1500);
    });
  },
  
  async queryAIAssistant(prompt) {
    try {
      const res = await fetch(`${this.baseUrl}/ai/query`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt })
      });
      if (res.ok) {
        const data = await res.json();
        let formatted = data.answer;
        if (data.recommendations && data.recommendations.length > 0) {
          formatted += "\n\nRecommended Mitigations:\n• " + data.recommendations.join("\n• ");
        }
        return formatted;
      }
    } catch (e) {
      console.warn("AI Assistant backend call failed, falling back to local reasoning:", e);
    }

    // Local fallback
    return new Promise((resolve) => {
      setTimeout(() => {
        let answer = "AetherGuard AI has analyzed your request against current telemetry.";
        if (prompt.toLowerCase().includes("brute force") || prompt.toLowerCase().includes("192.168.1.50")) {
          answer = "IP 192.168.1.50 triggered high risk due to 147 failed SSH logins across 18 unique root accounts in under 120 seconds. Anomaly Score: 0.94 (Threshold: 0.70). Recommended action: Immediate IP quarantine on firewall boundary.";
        } else if (prompt.toLowerCase().includes("recent") || prompt.toLowerCase().includes("summary")) {
          answer = "Over the last 24 hours, AetherGuard processed 12,540 logs. Detected 755 high-risk anomalies, dominated by SSH Brute Force attempts (420) and Internal Port Scans (210).";
        } else if (prompt.toLowerCase().includes("high-risk") || prompt.toLowerCase().includes("high risk")) {
          answer = "There are currently 2 active Critical incidents: INC-2026-00421 (Brute force from 192.168.1.50) and INC-2026-00419 (HTTP Flood from 10.0.12.88). Both require analyst clearance.";
        } else {
          answer = `Analysis for "${prompt}": Telemetry indicates stable system health. Isolation Forest model is currently running at 99.4% precision with zero worker queue backlog.`;
        }
        resolve(answer);
      }, 800);
    });
  }
};

function App() {

  const [userRole, setUserRole] = useState('Security Analyst');
  const [threatsList, setThreatsList] = useState(MOCK_THREATS);
  const [incidentsList, setIncidentsList] = useState(MOCK_INCIDENTS);
  const [selectedThreat, setSelectedThreat] = useState(MOCK_THREATS[0]);
  const [selectedIncident, setSelectedIncident] = useState(MOCK_INCIDENTS[0]);
  const [backendStatus, setBackendStatus] = useState({ fastapi: 'Checking...', isolation_forest: 'Standby' });
  const [uploadedFile, setUploadedFile] = useState(null);
  const [lastAnalysis, setLastAnalysis] = useState(null);
  const [aiAssistantOpen, setAiAssistantOpen] = useState(false);
  const [aiMessages, setAiMessages] = useState([
    { sender: 'ai', text: 'Welcome to AetherGuard AI SOC Assistant. FastAPI backend is integrated. How can I assist with threat triage today?' }
  ]);
  const [aiInput, setAiInput] = useState('');
  const [notificationsOpen, setNotificationsOpen] = useState(false);
  const [isProcessingAI, setIsProcessingAI] = useState(false);

  // Poll live backend health
  useEffect(() => {
    let isMounted = true;
    const updateHealth = async () => {
      const st = await FastAPI_Service.checkStatus();
      if (isMounted) setBackendStatus(st);
    };
    updateHealth();
    const interval = setInterval(updateHealth, 4000);
    return () => { isMounted = false; clearInterval(interval); };
  }, []);

  // Fetch initial live threats from backend
  useEffect(() => {
    let isMounted = true;
    const loadData = async () => {
      const [tData, iData] = await Promise.all([
        FastAPI_Service.fetchThreats(),
        FastAPI_Service.fetchIncidents()
      ]);
      if (isMounted) {
        if (tData && tData.length) {
          setThreatsList(tData);
          setSelectedThreat(tData[0]);
        }
        if (iData && iData.length) {
          setIncidentsList(iData);
          setSelectedIncident(iData[0]);
        }
      }
    };
    loadData();
  }, []);

  // Global Key Shortcut
  useEffect(() => {
    const handleKeyDown = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
        e.preventDefault();
        setAiAssistantOpen(prev => !prev);
      }
    };
    window.addEventListener('keydown', handleKeyDown);
    return () => window.removeEventListener('keydown', handleKeyDown);
  }, []);

  const handleSendAiMessage = async (textToSend) => {
    const text = textToSend || aiInput;
    if (!text.trim()) return;
    
    const newMsgs = [...aiMessages, { sender: 'user', text }];
    setAiMessages(newMsgs);
    setAiInput('');
    setIsProcessingAI(true);

    const reply = await FastAPI_Service.queryAIAssistant(text);
    setAiMessages([...newMsgs, { sender: 'ai', text: reply }]);
    setIsProcessingAI(false);
  };

  if (!isLoggedIn) {
    return <LoginPage onLogin={() => setIsLoggedIn(true)} onNavigateRegister={() => setActivePage('register')} activePage={activePage} setActivePage={setActivePage} />;
  }

  return (
    <div className="flex h-screen bg-[#0B1120] text-slate-100 font-sans overflow-hidden select-none">
      {/* Sidebar Navigation */}
      <Sidebar activePage={activePage} setActivePage={setActivePage} onLogout={() => setIsLoggedIn(false)} />

      {/* Main Content Area */}
      <div className="flex-1 flex flex-col min-w-0 overflow-hidden">
        {/* Top Header */}
        <Topbar 
          onOpenAi={() => setAiAssistantOpen(true)}
          notificationsOpen={notificationsOpen}
          setNotificationsOpen={setNotificationsOpen}
          activePage={activePage}
          userRole={userRole}
          backendStatus={backendStatus}
        />

        {/* Dynamic Page Router */}
        <main className="flex-1 overflow-y-auto p-6 bg-[#0B1120] relative">
          {activePage === 'login' && <LoginPage onLogin={() => setIsLoggedIn(true)} onNavigateRegister={() => setActivePage('register')} />}
          {activePage === 'register' && <RegisterPage onNavigateLogin={() => setActivePage('login')} />}
          {activePage === 'dashboard' && <DashboardView threats={threatsList} onSelectThreat={(t) => { setSelectedThreat(t); setActivePage('investigation'); }} onNavigate={setActivePage} />}
          {activePage === 'log-upload' && <LogUploadView onRunAnalysis={(file) => { setUploadedFile(file); setActivePage('ai-analysis'); }} />}
          {activePage === 'ai-analysis' && <AIAnalysisView file={uploadedFile} onComplete={(result) => { 
            if (result && result.threats && result.threats.length) {
              setThreatsList(result.threats);
            }
            setLastAnalysis(result);
            setActivePage('threat-detection'); 
          }} />}
          {activePage === 'threat-detection' && <ThreatDetectionView threats={threatsList} onInvestigate={(t) => { setSelectedThreat(t); setActivePage('investigation'); }} />}
          {activePage === 'investigation' && <ThreatInvestigationView threat={selectedThreat} onBack={() => setActivePage('threat-detection')} />}
          {activePage === 'threat-history' && <ThreatHistoryView threats={threatsList} />}
          {activePage === 'incidents' && <IncidentDetailsView incidents={incidentsList} incident={selectedIncident} onSelectIncident={setSelectedIncident} />}
          {activePage === 'reports' && <ReportsView onNavigateGenerate={() => setActivePage('generate-report')} />}
          {activePage === 'generate-report' && <GenerateReportView onBack={() => setActivePage('reports')} />}
          {activePage === 'users' && <UserManagementView />}
          {activePage === 'settings' && <SettingsView onUpdateEndpoint={(url) => FastAPI_Service.setBaseUrl(url)} />}
        </main>
      </div>

      {/* AI Assistant Drawer */}
      {aiAssistantOpen && (
        <AIAssistantDrawer 
          onClose={() => setAiAssistantOpen(false)}
          messages={aiMessages}
          input={aiInput}
          setInput={setAiInput}
          onSend={handleSendAiMessage}
          isProcessing={isProcessingAI}
        />
      )}
    </div>
  );
}

function LogUploadView({ onRunAnalysis }) {
  const [selectedFile, setSelectedFile] = useState(null);
  const [fileObject, setFileObject] = useState(null);
  const [dragActive, setDragActive] = useState(false);
  const [uploadProgress, setUploadProgress] = useState(0);
  const fileInputRef = React.useRef(null);

  const handleDrop = (e) => {
    e.preventDefault();
    setDragActive(false);
    if (e.dataTransfer.files && e.dataTransfer.files[0]) {
      handleRealFile(e.dataTransfer.files[0]);
    } else {
      simulateFileUpload("server_auth_syslog_2026.csv", "4.2 MB", 12540, null);
    }
  };

  const handleRealFile = (file) => {
    setFileObject(file);
    setUploadProgress(20);
    const sizeStr = (file.size / 1024).toFixed(1) + " KB";
    setSelectedFile({ name: file.name, size: sizeStr, records: Math.floor(file.size / 60) || 20, status: "Uploading..." });

    let p = 20;
    const interval = setInterval(() => {
      p += 35;
      if (p >= 100) {
        clearInterval(interval);
        setUploadProgress(100);
        setSelectedFile(prev => ({ ...prev, status: "Ready for Isolation Forest" }));
      } else {
        setUploadProgress(p);
      }
    }, 150);
  };

  const simulateFileUpload = (name, size, records, rawFile) => {
    setFileObject(rawFile);
    setUploadProgress(10);
    setSelectedFile({ name, size, records, status: "Uploading..." });
    
    let interval = setInterval(() => {
      setUploadProgress((prev) => {
        if (prev >= 100) {
          clearInterval(interval);
          setSelectedFile({ name, size, records, status: "Ready for AI Engine" });
          return 100;
        }
        return prev + 30;
      });
    }, 150);
  };

  return (
    <div className="max-w-4xl mx-auto space-y-6">
      <div>
        <h2 className="text-xl font-bold text-white flex items-center gap-2">
          <Upload className="w-5 h-5 text-blue-400" /> Server Log Upload & Ingestion
        </h2>
        <p className="text-xs text-slate-400 mt-1">
          Ingest raw system, syslog, or cloud access logs to trigger Scikit-Learn Isolation Forest threat evaluation.
        </p>
      </div>

      {/* Drag & Drop Zone */}
      <div 
        onDragOver={(e) => { e.preventDefault(); setDragActive(true); }}
        onDragLeave={() => setDragActive(false)}
        onDrop={handleDrop}
        className={`border-2 border-dashed rounded-2xl p-10 text-center transition flex flex-col items-center justify-center min-h-[260px] ${
          dragActive 
            ? 'border-blue-500 bg-blue-950/20' 
            : 'border-slate-700 bg-[#1E293B]/60 hover:border-slate-600'
        }`}
      >
        <div className="w-14 h-14 bg-slate-900 border border-slate-800 rounded-full flex items-center justify-center mb-4 text-cyan-400">
          <HardDrive className="w-7 h-7" />
        </div>
        <h3 className="text-base font-semibold text-slate-200">Drag and drop log files here</h3>
        <p className="text-xs text-slate-400 mt-1 mb-4">Supported Formats: <span className="font-mono text-cyan-300">.CSV, .JSON, .TXT (Syslog format)</span></p>
        
        <div className="flex gap-3">
          <input 
            type="file" 
            ref={fileInputRef} 
            onChange={(e) => e.target.files && e.target.files[0] && handleRealFile(e.target.files[0])} 
            accept=".csv,.json,.txt" 
            className="hidden" 
          />
          <button 
            onClick={() => fileInputRef.current && fileInputRef.current.click()}
            className="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-xs font-medium transition flex items-center gap-1.5 shadow-md shadow-blue-500/20"
          >
            <Upload className="w-3.5 h-3.5" /> Browse System Log File
          </button>
          <button 
            onClick={() => simulateFileUpload("sample_network_logs.csv", "1.2 KB", 20, null)}
            className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-lg text-xs font-medium transition"
          >
            Load Sample Security CSV
          </button>
        </div>
      </div>

      {/* Uploaded File Details & Status */}
      {selectedFile && (
        <div className="bg-[#1E293B] border border-slate-800 rounded-xl p-5 space-y-4">
          <div className="flex items-center justify-between">
            <div className="flex items-center gap-3">
              <FileText className="w-8 h-8 text-cyan-400" />
              <div>
                <h4 className="text-sm font-bold text-slate-200">{selectedFile.name}</h4>
                <p className="text-xs text-slate-400 font-mono">
                  {selectedFile.size} • {selectedFile.records.toLocaleString()} Records • UTF-8 Encoded
                </p>
              </div>
            </div>
            <span className={`text-xs px-2.5 py-1 rounded-full font-mono ${
              uploadProgress === 100 
                ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' 
                : 'bg-blue-950 text-blue-400 border border-blue-800'
            }`}>
              {selectedFile.status}
            </span>
          </div>

          {/* Progress Bar */}
          <div className="w-full bg-slate-900 h-2 rounded-full overflow-hidden">
            <div className="bg-gradient-to-r from-blue-500 to-cyan-400 h-full transition-all duration-300" style={{ width: `${uploadProgress}%` }}></div>
          </div>

          {/* Action Trigger */}
          {uploadProgress === 100 && (
            <div className="flex justify-end pt-2">
              <button 
                onClick={() => onRunAnalysis(fileObject)}
                className="px-5 py-2.5 bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-500 hover:to-cyan-400 text-white font-bold rounded-lg text-xs shadow-lg shadow-cyan-500/10 flex items-center gap-2 transition"
              >
                <Zap className="w-4 h-4 fill-current" /> Run AI Isolation Forest Analysis
              </button>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function AIAnalysisView({ file, onComplete }) {
  const [currentStep, setCurrentStep] = useState(0);
  const [analysisResult, setAnalysisResult] = useState(null);

  const steps = [
    { title: "LOG INGESTION", desc: "Parsing CSV/JSON structured payload" },
    { title: "DATA CLEANING", desc: "Filtering nulls & normalizing IPs" },
    { title: "FEATURE EXTRACTION", desc: "Computing delta time & login rates" },
    { title: "FEATURE SCALING", desc: "StandardScaler transformation" },
    { title: "ISOLATION FOREST", desc: "Fitting IsolationForest tree models" },
    { title: "ANOMALY DETECTION", desc: "Evaluating decision function score" },
    { title: "THREAT CLASSIFICATION", desc: "Categorizing attack patterns" },
    { title: "RISK ANALYSIS", desc: "Assigning critical threshold metrics" }
  ];

  // Trigger live ML execution in background while visual steps animate
  useEffect(() => {
    let isMounted = true;
    const runML = async () => {
      const res = await FastAPI_Service.runIsolationForestAnalysis(file);
      if (isMounted) setAnalysisResult(res);
    };
    runML();
    return () => { isMounted = false; };
  }, [file]);

  useEffect(() => {
    if (currentStep < steps.length) {
      const timer = setTimeout(() => {
        setCurrentStep(prev => prev + 1);
      }, 450);
      return () => clearTimeout(timer);
    }
  }, [currentStep]);

  return (
    <div className="max-w-4xl mx-auto space-y-8 py-4">
      <div className="text-center space-y-2">
        <div className="inline-flex items-center gap-2 px-3 py-1 bg-cyan-950/80 border border-cyan-800 rounded-full text-cyan-400 text-xs font-mono">
          <Cpu className="w-3.5 h-3.5 animate-spin-slow" /> ML PIPELINE EXECUTING
        </div>
        <h2 className="text-2xl font-bold text-white">AI Cyber Threat Pipeline</h2>
        <p className="text-xs text-slate-400 max-w-lg mx-auto">
          Executing Scikit-Learn Isolation Forest engine against ingested telemetry to identify outlier network vectors.
        </p>
      </div>

      {/* Visual Step-by-Step Flow */}
      <div className="bg-[#1E293B] border border-slate-800 rounded-2xl p-6 shadow-2xl relative overflow-hidden">
        <div className="space-y-4">
          {steps.map((s, idx) => {
            const isDone = idx < currentStep;
            const isCurrent = idx === currentStep;

            return (
              <div 
                key={idx}
                className={`p-3.5 rounded-xl border flex items-center justify-between transition-all duration-300 ${
                  isDone 
                    ? 'bg-slate-900/90 border-emerald-500/40 text-slate-200' 
                    : isCurrent 
                    ? 'bg-blue-950/40 border-cyan-500 shadow-md shadow-cyan-500/10 text-white' 
                    : 'bg-slate-900/30 border-slate-800/60 text-slate-600'
                }`}
              >
                <div className="flex items-center gap-4">
                  <div className={`w-7 h-7 rounded-full flex items-center justify-center font-mono text-xs font-bold ${
                    isDone 
                      ? 'bg-emerald-500 text-slate-950' 
                      : isCurrent 
                      ? 'bg-cyan-400 text-slate-950 animate-pulse' 
                      : 'bg-slate-800 text-slate-500'
                  }`}>
                    {isDone ? <Check className="w-4 h-4 stroke-[3]" /> : idx + 1}
                  </div>
                  <div>
                    <h4 className="text-xs font-bold font-mono tracking-wide">{s.title}</h4>
                    <p className="text-[11px] text-slate-400">{s.desc}</p>
                  </div>
                </div>

                <div className="font-mono text-xs">
                  {isDone && <span className="text-emerald-400 text-[11px]">COMPLETED</span>}

        {currentStep >= steps.length && (
          <div className="mt-6 pt-4 border-t border-slate-800 text-center animate-fade-in">
            <div className="p-3 bg-emerald-950/30 border border-emerald-800/50 rounded-xl mb-4 text-emerald-400 text-xs font-mono">

            >
              View Threat Detection Grid <ArrowRight className="w-4 h-4" />
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

        {messages.map((m, idx) => (
          <div key={idx} className={`flex ${m.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
            <div className={`max-w-[85%] p-3 rounded-xl ${
              m.sender === 'user' 
                ? 'bg-blue-600 text-white' 
                : 'bg-slate-800/90 text-slate-200 border border-slate-700'
            }`}>
              {m.text}
            </div>
          </div>
        ))}
        {isProcessing && (
          <div className="text-slate-500 font-mono text-[10px] animate-pulse">
            Analyzing telemetry database...
          </div>
        )}
      </div>

      {/* Quick Prompt Chips */}
      <div className="p-2 border-t border-slate-800/60 flex flex-wrap gap-1 bg-slate-950/40">
        {["Explain this threat", "Show high-risk activity", "Why was IP flagged?"].map((chip, idx) => (
          <button 
            key={idx} 
            onClick={() => onSend(chip)}
            className="text-[10px] bg-slate-800 hover:bg-slate-700 text-cyan-300 px-2 py-1 rounded border border-slate-700 transition"
          >
            {chip}
          </button>
        ))}
      </div>

      {/* Input Form */}
      <div className="p-3 border-t border-slate-800 bg-slate-900">
        <form onSubmit={(e) => { e.preventDefault(); onSend(); }} className="flex gap-2">
          <input 
            type="text" 
            placeholder="Ask AI threat question..." 
            value={input}
            onChange={(e) => setInput(e.target.value)}
            className="flex-1 bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-cyan-500"
          />
          <button type="submit" className="p-2 bg-cyan-600 hover:bg-cyan-500 text-slate-950 font-bold rounded-lg transition">
            <Send className="w-3.5 h-3.5" />
          </button>
        </form>
      </div>
    </div>
  );
}

function KpiCard({ title, value, change, subtext, icon: Icon, color }) {
  const colorMap = {
    blue: 'border-blue-500/30 text-blue-400 bg-blue-950/20',
    emerald: 'border-emerald-500/30 text-emerald-400 bg-emerald-950/20',
    amber: 'border-amber-500/30 text-amber-400 bg-amber-950/20',
    rose: 'border-rose-500/30 text-rose-400 bg-rose-950/20',
  };

  return (
    <div className={`p-4 rounded-xl border bg-[#1E293B] shadow-lg flex justify-between items-start ${colorMap[color]}`}>
      <div>
        <p className="text-[11px] text-slate-400 font-medium">{title}</p>
        <h3 className="text-2xl font-extrabold text-white mt-1 font-mono">{value}</h3>
        <p className="text-[10px] text-slate-400 mt-1">
          <span className="font-semibold text-cyan-400">{change}</span> • {subtext}
        </p>
      </div>
      <div className="p-2 rounded-lg bg-slate-900/80 border border-slate-800">
        <Icon className="w-5 h-5" />
      </div>
    </div>
  );
}

function ThreatStatMini({ title, count, percent, color, border }) {
  return (
    <div className={`p-3 rounded-lg bg-[#1E293B] border ${border} shadow-sm`}>
      <p className="text-[10px] uppercase font-mono text-slate-400">{title}</p>
      <div className="flex items-baseline justify-between mt-1">
        <span className={`text-base font-bold font-mono ${color}`}>{count}</span>
        <span className="text-[10px] text-slate-500 font-mono">{percent}</span>
      </div>
    </div>
  );
}

function RiskBadge({ level }) {
  const config = {
    Critical: 'bg-red-950 text-red-400 border-red-800',
    High: 'bg-orange-950 text-orange-400 border-orange-800',
    Medium: 'bg-amber-950 text-amber-400 border-amber-800',
    Low: 'bg-emerald-950 text-emerald-400 border-emerald-800',
  };

  return (
    <span className={`px-2 py-0.5 rounded text-[10px] font-mono font-bold border ${config[level] || config.Low}`}>
      {level}
    </span>
  );
}
